            <label class="modal-label">타입 선택</label>
            <div class="type-buttons">
                <button class="type-btn" data-type="flight" onclick="selectType('flight')">비행</button>
                <button class="type-btn" data-type="dayoff" onclick="selectType('dayoff')">휴무</button>
                <button class="type-btn" data-type="event" onclick="selectType('event')">이벤트</button>
            </div>

            <!-- 비행 필드 -->
            <div class="flight-fields" id="flightFields">
                <div id="flightEntries"></div>
                <button class="add-flight-btn" onclick="addFlightEntry()">+ 비행 추가</button>
            </div>

            <!-- 이벤트 필드 -->
            <div class="event-fields" id="eventFields">
                <label class="modal-label">이벤트 텍스트</label>
                <input type="text" class="modal-input" id="eventText" placeholder="예: 장거리 STBY, 연차휴가">
            </div>

            <div class="modal-buttons">
                <button class="modal-btn modal-btn-reset" onclick="resetSchedule()">원래대로</button>
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">취소</button>
                <button class="modal-btn modal-btn-primary" onclick="saveSchedule()">저장</button>
            </div>
        </div>

                    { flight: '8941', route: 'GMP→CJU', departure: '11:20', arrival: '12:35', showup: 'G 10:10' },
                    { flight: '8942', route: 'CJU→GMP', departure: '13:40', arrival: '14:55' },
                    { flight: '8973', route: 'GMP→CJU', departure: '15:45', arrival: '17:00' },
                    { flight: '8980', route: 'CJU→GMP', departure: '18:40', arrival: '19:55' }
                ]},
                '2026-08-28': { type: 'event', text: 'STBY확인요망' },
                '2026-08-29': { type: 'flight', flights: [{ flight: '116', route: 'ICN→KIX', departure: '19:35', arrival: '21:35', showup: 'S 18:15' }] },

                '2026-08-31': { type: 'dayoff' }
            }
        };

        // GAS API URL
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzOa9YK6S0fkeRqeeVolLoJ-eKpSAu-oRs92RwGA7xj0KVqTtx_CGk6Z9LkYMniV7MB/exec';
        
        // 서버에서 가져온 데이터 (localStorage 대체)
        let serverData = {};
        let isLoading = false;

        // 서버에서 데이터 가져오기
        async function loadServerData() {
            if (isLoading) return;
            isLoading = true;
            try {
                // 캐시 방지를 위해 timestamp 추가
                const response = await fetch(GAS_URL + '?t=' + Date.now(), {
                    cache: 'no-store'
                });
                const data = await response.json();
                if (!data.error) {
                    // GAS에서 받은 데이터를 정규화
                    serverData = normalizeServerData(data);
                    console.log('서버 데이터 로드됨:', serverData);
                }
            } catch (err) {
                console.error('데이터 로드 실패:', err);
            }
            isLoading = false;
        }

        // 서버 데이터 정규화 (날짜/시간 포맷 변환)
        function normalizeServerData(rawData) {
            const normalized = {};
            
            Object.entries(rawData).forEach(([dateKey, value]) => {
                // 날짜 키 정규화
                const normalizedDate = normalizeDate(dateKey);
                if (!normalizedDate) return;
                
                // 값 정규화
                if (value.type === 'flight' && value.flights) {
                    normalized[normalizedDate] = {
                        type: 'flight',
                        flights: value.flights.map(flight => ({
                            flight: flight.flight || '',
                            route: flight.route || '',
                            departure: normalizeTime(flight.departure),
                            arrival: normalizeTime(flight.arrival),
                            ...(flight.showup ? { showup: normalizeShowup(flight.showup) } : {})
                        }))
                    };
                } else {
                    normalized[normalizedDate] = value;
                }
            });
            
            return normalized;
        }

        // 날짜 정규화: "Sun Aug 02 2026 ..." → "2026-08-02"
        function normalizeDate(dateStr) {
            if (!dateStr) return null;
            
            // 이미 YYYY-MM-DD 형식이면 그대로
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                return dateStr;
            }
            
            // Date 파싱 시도
            try {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return null;
                
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            } catch (e) {
                return null;
            }
        }

        // 시간 정규화: "Sat Dec 30 1899 06:55:00" → "06:55"
        function normalizeTime(timeStr) {
            if (!timeStr || timeStr === '-') return timeStr || '';
            
            // 이미 HH:MM 형식이면 그대로 (+1 등 포함)
            if (/^\d{1,2}:\d{2}(\([^)]+\))?$/.test(timeStr)) {
                return timeStr;
            }
            
            // Date 문자열이면 시간 추출
            try {
                const date = new Date(timeStr);
                if (isNaN(date.getTime())) return timeStr;
                
                const h = String(date.getHours()).padStart(2, '0');
                const m = String(date.getMinutes()).padStart(2, '0');
                return `${h}:${m}`;
            } catch (e) {
                return timeStr;
            }
        }

        // 쇼업 정규화: "Sat Dec 30 1899 12:05:00" → "T2 12:05" (원본에 접두사 있으면 유지)
        function normalizeShowup(showupStr) {
            if (!showupStr) return '';
            
            // 이미 정상 형식 (예: "T2 05:40")
            if (/^[A-Z]+ \d{1,2}:\d{2}$/.test(showupStr)) {
                return showupStr;
            }
            
            // Date 문자열이면 시간만 추출 (접두사 없음)
            try {
                const date = new Date(showupStr);
                if (isNaN(date.getTime())) return showupStr;
                
                const h = String(date.getHours()).padStart(2, '0');
                const m = String(date.getMinutes()).padStart(2, '0');
                return `${h}:${m}`;
            } catch (e) {
                return showupStr;
            }
        }

        // 서버에 데이터 저장
        async function saveToServer(dateStr, data) {
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ date: dateStr, data: data })
                });
                // 저장 후 데이터 다시 로드
                setTimeout(async () => {
                    await loadServerData();
                    generateScheduleList();
                }, 1000);
            } catch (err) {
                console.error('저장 실패:', err);
            }
        }

        let currentMonth = new Date().getMonth() + 1; // 현재 월 자동 감지
        let currentEditingDate = null;
        let currentEditingType = 'flight';

        // 공항 코드별 국기 매핑
        const airportFlags = {
            // 한국
            'ICN': '🇰🇷', 'GMP': '🇰🇷', 'CJU': '🇰🇷',
            // 미국
            'SFO': '🇺🇸', 'LAX': '🇺🇸', 'JFK': '🇺🇸', 'ALA': '🇺🇸',
            // 일본
            'KIX': '🇯🇵', 'NRT': '🇯🇵', 'HND': '🇯🇵', 'FUK': '🇯🇵',
            // 중국
            'PEK': '🇨🇳', 'PVG': '🇨🇳', 'SHA': '🇨🇳', 'CAN': '🇨🇳',
            'SZX': '🇨🇳', 'XIY': '🇨🇳', 'CSX': '🇨🇳',
            // 베트남
            'SGN': '🇻🇳', 'HAN': '🇻🇳',
            // 몽골
            'UBN': '🇲🇳',
            // 헝가리
            'BUD': '🇭🇺',
            // 대만
            'TPE': '🇹🇼', 'TSA': '🇹🇼',
            // 태국
            'BKK': '🇹🇭',
            // 싱가포르
            'SIN': '🇸🇬',
            // 홍콩
            'HKG': '🇭🇰',
            // 영국
            'LHR': '🇬🇧',

            'MAD': '🇪🇸', 'BCN': '🇪🇸',

            'FCO': '🇮🇹', 'MXP': '🇮🇹',

            'SVO': '🇷🇺', 'VVO': '🇷🇺',

            // UAE
            'DXB': '🇦🇪', 'AUH': '🇦🇪'
        };

        function getFlagsForRoute(route) {
            if (!route) return '';
            const parts = route.split('→');
            if (parts.length !== 2) return '';
            const from = parts[0].trim();
            const to = parts[1].trim();
            const fromFlag = airportFlags[from] || '';
            const toFlag = airportFlags[to] || '';
            return `${fromFlag}→${toFlag}`;
        }

        // localStorage에서 수정된 데이터 불러오기
        function getCustomData() {
            try {
                const data = localStorage.getItem('customSchedule');
                return data ? JSON.parse(data) : {};
            } catch (e) {
                return {};
            }
        }

        function saveCustomData(data) {
            localStorage.setItem('customSchedule', JSON.stringify(data));
        }

        // 실제 스케줄 데이터 가져오기 (수정된 것 우선)
        function getScheduleForDate(dateStr) {
            const custom = getCustomData();
            if (custom[dateStr]) {
                return { data: custom[dateStr], isModified: true };
            }
            const scheduleData = monthlyData[currentMonth];
            if (scheduleData && scheduleData[dateStr]) {
                return { data: scheduleData[dateStr], isModified: false };
            }
            return null;
        }

        // 편집 모달 열기
        function openEditModal(dateStr) {
            currentEditingDate = dateStr;
            const modal = document.getElementById('editModal');
            const existing = getScheduleForDate(dateStr);
            
            document.getElementById('modalTitle').textContent = `${formatDate(dateStr)} 편집`;
            
            // 기존 데이터로 초기화
            if (existing) {

                if (data.type === 'flight') {
                    selectType('flight');
                    renderFlightEntries(data.flights);
                } else if (data.type === 'dayoff') {
                    selectType('dayoff');
                } else if (data.type === 'event' || data.type === 'layover') {
                    selectType('event');
                    document.getElementById('eventText').value = data.text || '';
                }
            } else {
                selectType('flight');
                renderFlightEntries([{}]);
            }
            
            modal.classList.add('show');

        function closeModal() {
            document.getElementById('editModal').classList.remove('show');
            currentEditingDate = null;
        }

        function selectType(type) {
            currentEditingType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            
            document.getElementById('flightFields').classList.toggle('show', type === 'flight');
            document.getElementById('eventFields').classList.toggle('show', type === 'event');
            
            // 비행 선택 시 최소 1개 엔트리 필요
            if (type === 'flight') {
                const entries = document.getElementById('flightEntries');

                    renderFlightEntries([{}]);
                }
            }

        function renderFlightEntries(flights) {
            const container = document.getElementById('flightEntries');
            container.innerHTML = '';
            flights.forEach((flight, idx) => {
                container.appendChild(createFlightEntry(flight, idx));
            });
        }

        function createFlightEntry(flight, idx) {
            const div = document.createElement('div');
            div.className = 'flight-entry';
            
            // 노선 파싱 (예: "ICN→SGN" → from: "ICN", to: "SGN")
            let routeFrom = '', routeTo = '';
            if (flight.route) {
                const parts = flight.route.split('→');
                routeFrom = parts[0] || '';
                routeTo = parts[1] || '';
            }
            
            // 시간 파싱 (예: "07:30" → hour: "07", min: "30")
            const parseTime = (timeStr) => {
                if (!timeStr || timeStr === '-') return { hour: '', min: '', suffix: '' };
                // (+1) 같은 것 처리
                const suffixMatch = timeStr.match(/\(([^)]+)\)/);
                const suffix = suffixMatch ? suffixMatch[1] : '';
                const cleanTime = timeStr.replace(/\([^)]+\)/, '').trim();
                const [h, m] = cleanTime.split(':');
                return { hour: h || '', min: m || '', suffix: suffix };
            };
            
            const dep = parseTime(flight.departure);
            const arr = parseTime(flight.arrival);
            
            // 쇼업 파싱 (예: "T2 05:40" → prefix: "T2", hour: "05", min: "40")
            let showupPrefix = '', showupHour = '', showupMin = '';
            if (flight.showup) {
                const match = flight.showup.match(/^(\S+)\s+(\d{1,2}):(\d{2})$/);
                if (match) {
                    showupPrefix = match[1];
                    showupHour = match[2];
                    showupMin = match[3];
                }
            }
            
            div.innerHTML = `
                <div class="flight-entry-title">비행 ${idx + 1}</div>
                <button class="remove-flight-btn" onclick="removeFlightEntry(this)">×</button>
                
                <label class="modal-label">항공편</label>
                <input type="tel" inputmode="numeric" class="modal-input flight-num" value="${flight.flight || ''}" placeholder="예: 731">
                
                <label class="modal-label">노선 (출발 → 도착)</label>
                <div class="route-input-group">
                    <input type="text" class="modal-input flight-route-from" value="${routeFrom}" placeholder="ICN" maxlength="3" style="text-transform: uppercase;">
                    <span class="route-arrow">→</span>
                    <input type="text" class="modal-input flight-route-to" value="${routeTo}" placeholder="SGN" maxlength="3" style="text-transform: uppercase;">
                </div>
                
                <label class="modal-label">출발 시간</label>
                <div class="time-input-group">
                    <input type="tel" inputmode="numeric" class="modal-input flight-dep-hour" value="${dep.hour}" placeholder="07" maxlength="2">
                    <span class="time-colon">:</span>
                    <input type="tel" inputmode="numeric" class="modal-input flight-dep-min" value="${dep.min}" placeholder="30" maxlength="2">
                    <input type="text" class="modal-input flight-dep-suffix" value="${dep.suffix}" placeholder="+1" maxlength="3" style="max-width: 60px;">
                </div>
                
                <label class="modal-label">도착 시간</label>
                <div class="time-input-group">
                    <input type="tel" inputmode="numeric" class="modal-input flight-arr-hour" value="${arr.hour}" placeholder="11" maxlength="2">
                    <span class="time-colon">:</span>
                    <input type="tel" inputmode="numeric" class="modal-input flight-arr-min" value="${arr.min}" placeholder="00" maxlength="2">
                    <input type="text" class="modal-input flight-arr-suffix" value="${arr.suffix}" placeholder="+1" maxlength="3" style="max-width: 60px;">
                </div>
                
                <label class="modal-label">쇼업 (선택사항)</label>
                <div class="time-input-group">
                    <select class="modal-input modal-select flight-showup-prefix" style="max-width: 80px;">
                        <option value="" ${!showupPrefix ? 'selected' : ''}>없음</option>
                        <option value="T2" ${showupPrefix === 'T2' ? 'selected' : ''}>T2</option>
                        <option value="T1" ${showupPrefix === 'T1' ? 'selected' : ''}>T1</option>
                        <option value="GS" ${showupPrefix === 'GS' ? 'selected' : ''}>GS</option>
                        <option value="G" ${showupPrefix === 'G' ? 'selected' : ''}>G</option>
                        <option value="S" ${showupPrefix === 'S' ? 'selected' : ''}>S</option>
                    </select>
                    <input type="tel" inputmode="numeric" class="modal-input flight-showup-hour" value="${showupHour}" placeholder="05" maxlength="2">
                    <span class="time-colon">:</span>
                    <input type="tel" inputmode="numeric" class="modal-input flight-showup-min" value="${showupMin}" placeholder="40" maxlength="2">
                </div>
            `;
            
            // 대문자 자동 변환
            div.querySelector('.flight-route-from').addEventListener('input', function() {
                this.value = this.value.toUpperCase();
            });
            div.querySelector('.flight-route-to').addEventListener('input', function() {
                this.value = this.value.toUpperCase();
            });
            
            // 시간 자동 이동 (2자리 입력하면 다음 필드로)
            div.querySelectorAll('input[maxlength="2"]').forEach(input => {
                input.addEventListener('input', function() {
                    if (this.value.length === 2) {
                        const inputs = Array.from(div.querySelectorAll('input, select'));
                        const idx = inputs.indexOf(this);
                        if (idx < inputs.length - 1) {
                            const next = inputs[idx + 1];
                            if (next && next.tagName === 'INPUT' && next.type !== 'text') {
                                next.focus();
                            } else if (next) {
                                next.focus();
                            }
                        }
                    }
                });
            });
            
            return div;
        }

        function addFlightEntry() {
            const container = document.getElementById('flightEntries');
            const idx = container.children.length;
            container.appendChild(createFlightEntry({}, idx));
        }

        function removeFlightEntry(btn) {
            const entries = document.getElementById('flightEntries');
            if (entries.children.length > 1) {
                btn.closest('.flight-entry').remove();
                // 인덱스 재설정
                entries.querySelectorAll('.flight-entry-title').forEach((title, idx) => {
                    title.textContent = `비행 ${idx + 1}`;
                });
            } else {
                alert('최소 1개의 비행이 필요합니다.');
            }
        }

        function saveSchedule() {
            if (!currentEditingDate) return;

            let newData;

            if (currentEditingType === 'flight') {
                const entries = document.querySelectorAll('#flightEntries .flight-entry');
                const flights = [];
                entries.forEach(entry => {
                    const flightNum = entry.querySelector('.flight-num').value.trim();
                    const routeFrom = entry.querySelector('.flight-route-from').value.trim().toUpperCase();
                    const routeTo = entry.querySelector('.flight-route-to').value.trim().toUpperCase();
                    
                    const depHour = entry.querySelector('.flight-dep-hour').value.trim();
                    const depMin = entry.querySelector('.flight-dep-min').value.trim();
                    const depSuffix = entry.querySelector('.flight-dep-suffix').value.trim();
                    
                    const arrHour = entry.querySelector('.flight-arr-hour').value.trim();
                    const arrMin = entry.querySelector('.flight-arr-min').value.trim();
                    const arrSuffix = entry.querySelector('.flight-arr-suffix').value.trim();
                    
                    const showupPrefix = entry.querySelector('.flight-showup-prefix').value;
                    const showupHour = entry.querySelector('.flight-showup-hour').value.trim();
                    const showupMin = entry.querySelector('.flight-showup-min').value.trim();
                    
                    // 노선 조합
                    let route = '';
                    if (routeFrom && routeTo) {
                        route = `${routeFrom}→${routeTo}`;
                    }
                    
                    // 시간 조합
                    const formatTime = (h, m, suffix) => {
                        if (!h && !m) return '';
                        if (h === '-' || m === '-') return '-';
                        const time = `${h.padStart(2, '0')}:${m.padStart(2, '0')}`;
                        return suffix ? `${time}(${suffix})` : time;
                    };
                    
                    const departure = formatTime(depHour, depMin, depSuffix);
                    const arrival = formatTime(arrHour, arrMin, arrSuffix);
                    
                    // 쇼업 조합
                    let showup = '';
                    if (showupPrefix && showupHour && showupMin) {
                        showup = `${showupPrefix} ${showupHour.padStart(2, '0')}:${showupMin.padStart(2, '0')}`;
                    }
                    
                    if (flightNum || route) {
                        const flight = { flight: flightNum, route: route, departure: departure || '-', arrival: arrival || '-' };
                        if (showup) flight.showup = showup;
                        flights.push(flight);
                    }
                });
                
                if (flights.length === 0) {
                    alert('최소 1개의 비행 정보를 입력해주세요.');
                    return;
                }
                
                newData = { type: 'flight', flights: flights };
            } else if (currentEditingType === 'dayoff') {
                newData = { type: 'dayoff' };
            } else if (currentEditingType === 'event') {
                const text = document.getElementById('eventText').value.trim();
                if (!text) {
                    alert('이벤트 텍스트를 입력해주세요.');
                    return;
                }
                newData = { type: 'event', text: text };
            }

            // 로컬 저장 (즉시 반영)
            const custom = getCustomData();
            custom[currentEditingDate] = newData;
            saveCustomData(custom);
            
            // 서버 저장 (백그라운드)
            saveToServer(currentEditingDate, newData);
            
            // 즉시 반영 (서버 응답 기다리지 않음)
            serverData[currentEditingDate] = newData;
            
            closeModal();
            generateScheduleList();
        }

        function resetSchedule() {
            if (!currentEditingDate) return;
            if (!confirm('이 날짜의 수정 사항을 초기화할까요?')) return;
            
            const custom = getCustomData();
            delete custom[currentEditingDate];
            saveCustomData(custom);
            closeModal();
            generateScheduleList();
        }

        // 배경 클릭 시 모달 닫기
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeModal();
        });

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const day = days[date.getDay()];
            return `${dateStr.split('-')[2]}일 (${day})`;
        }

        function generateMonthTabs() {
            const tabs = document.getElementById('monthTabs');
            tabs.innerHTML = '';
            
            for (let month = 1; month <= 12; month++) {
                const tab = document.createElement('button');
                tab.className = 'month-tab' + (month === currentMonth ? ' active' : '');
                tab.textContent = month + '월';
                tab.onclick = () => switchMonth(month);
                tabs.appendChild(tab);
            }
            
            // 현재 월 탭으로 스크롤
            setTimeout(() => {
                const activeTab = tabs.querySelector('.month-tab.active');
                if (activeTab) {
                    activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }, 100);
        }

        function switchMonth(month) {
            currentMonth = month;
            generateMonthTabs();
            generateScheduleList();
            // 현재 월로 전환 시에만 오늘로 스크롤
            if (month === new Date().getMonth() + 1) {
                setTimeout(() => scrollToToday(), 100);
            } else {
                // 다른 월은 맨 위로
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function generateScheduleList() {
            const list = document.getElementById('scheduleList');
            list.innerHTML = '';

            const scheduleData = monthlyData[currentMonth] || {};

            // 기본 데이터 복사 후, 서버 데이터로 덮어쓰기 (서버 우선!)
            const mergedData = { ...scheduleData };
            Object.keys(serverData).forEach(dateStr => {
                const month = parseInt(dateStr.split('-')[1]);
                if (month === currentMonth) {
                    mergedData[dateStr] = serverData[dateStr];
                }
            });

            console.log('원본 데이터 (해당 월):', scheduleData);
            console.log('서버 데이터:', serverData);
            console.log('병합 데이터:', mergedData);

            // 데이터가 없으면 빈 상태 표시
            if (Object.keys(mergedData).length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <div class="empty-state-text">
                            ${currentMonth}월 스케줄이 아직 없어요<br>
                            태근에게 ${currentMonth}월 스케줄표를 전달해주세요!
                        </div>
                    </div>
                `;
                return;
            }

            // 날짜 정렬
            const sortedData = Object.entries(mergedData).sort((a, b) => a[0].localeCompare(b[0]));

            // 오늘 날짜 계산
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            sortedData.forEach(([dateStr, mergedItem]) => {
                const item = document.createElement('div');
                item.className = 'schedule-item';
                
                // 오늘 날짜 표시
                if (dateStr === todayStr) {
                    item.id = 'today-card';
                    item.classList.add('today');
                }
                
                // 서버 데이터가 있으면 "수정됨" 뱃지
                const data = mergedItem;
                const isModified = !!serverData[dateStr];

                let editBtn = `<button class="edit-btn" onclick="openEditModal('${dateStr}')">✏️</button>`;
                let modifiedBadge = isModified ? `<span class="modified-badge">수정됨</span>` : '';

                if (data.type === 'flight') {
                    item.className += ' flight-item';
                    let html = `<div class="date">${formatDate(dateStr)}</div>${modifiedBadge}${editBtn}`;

                    data.flights.forEach((flight, idx) => {
                        const flags = getFlagsForRoute(flight.route);
                        let flightLine = `${flight.flight} · ${flight.route}`;
                        if (flags) {
                            flightLine += ` <span class="route-flags">${flags}</span>`;
                        }
                        if (flight.showup) {
                            flightLine += ` <span class="showup-badge">${flight.showup}</span>`;
                        }
                        html += `<div class="flight-number">${flightLine}</div>`;
                        
                        html += `<div class="time-info">`;
                        html += `<span class="time-label">출발</span><span class="time-value">${flight.departure || '-'}</span>`;
                        html += `<span class="time-label">도착</span><span class="time-value">${flight.arrival || '-'}</span>`;
                        html += `</div>`;
                        
                        if (flight.route && flight.route.startsWith('ICN') && flight.departure && flight.departure !== '-') {
                            html += `<button class="kakao-map-btn" onclick="openKakaoSubway()">🚇 카카오 지하철</button>`;
                        }
                    });

                    item.innerHTML = html;
                } else if (data.type === 'dayoff') {
                    item.className += ' dayoff';
                    item.innerHTML = `
                        <div class="date">${formatDate(dateStr)}</div>
                        ${modifiedBadge}${editBtn}
                        <div class="dayoff-text">휴무</div>
                    `;
                } else if (data.type === 'event') {
                    item.className += ' event';
                    item.innerHTML = `
                        <div class="date">${formatDate(dateStr)}</div>
                        ${modifiedBadge}${editBtn}
                        <div class="event-text">${data.text}</div>
                    `;
                } else if (data.type === 'layover') {
                    item.className += ' event';
                    item.innerHTML = `
                        <div class="date">${formatDate(dateStr)}</div>
                        ${modifiedBadge}${editBtn}
                        <div class="event-text">${data.text}</div>
                    `;
                }

                list.appendChild(item);
            });
        }

        // 초기 실행 - 서버 데이터 먼저 로드 후 화면 그리기
        (async function init() {
            generateMonthTabs();
            
            // 로딩 화면 표시
            document.getElementById('scheduleList').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div class="empty-state-text">불러오는 중...</div>
                </div>
            `;
            
            // 서버 데이터 먼저 로드
            await loadServerData();
            
            // 그 다음 화면 그리기
            generateScheduleList();
            
            // 오늘로 스크롤
            setTimeout(() => scrollToToday(), 100);
        })();
        
        // 주기적으로 서버 데이터 갱신 (30초마다)
        setInterval(async () => {
            await loadServerData();
            generateScheduleList();
        }, 30000);
        
        function scrollToToday() {
            const todayCard = document.getElementById('today-card');
            if (todayCard) {
                todayCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 카카오 지하철 열기 함수
        function openKakaoSubway() {
            const appUrl = 'kakaosubway://';
            const fallbackUrl = 'https://apps.apple.com/kr/app/id1095533900';
            
            // 숨겨진 iframe으로 앱 실행 시도
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = appUrl;
            document.body.appendChild(iframe);
            
            // 0.5초 후 앱이 안 열렸으면 앱스토어로
            setTimeout(() => {
                document.body.removeChild(iframe);
                if (!document.hidden) {
                    window.location.href = fallbackUrl;
                }
            }, 500);
        }
    </script>
</body>
